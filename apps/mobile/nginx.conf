server {
    # 8080: the image runs nginx as the unprivileged nginx user, which cannot
    # bind a privileged port. Caddy proxies here (infra/caddy-sonoqui.snippet).
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Emit relative Location headers. TLS ends at Caddy and the internal hop is
    # plain http on 8080, so the `$uri/` directory redirect below would
    # otherwise advertise :8080 to the browser.
    absolute_redirect off;

    # Long cache for hashed Expo assets.
    location /_expo/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback — expo-router emits index.html for the root route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
