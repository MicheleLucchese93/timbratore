server {
    # 8080: the image runs nginx as the unprivileged nginx user, which cannot
    # bind a privileged port. Caddy proxies here (infra/caddy-sonoqui.snippet).
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Emit relative Location headers. TLS ends at Caddy and the internal hop is
    # plain http on 8080, so an absolute redirect would advertise :8080 to the
    # browser. Keeps any nginx-generated redirect port- and scheme-agnostic.
    absolute_redirect off;

    # Long cache for hashed Vite assets.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback — every non-asset path returns index.html so React Router handles it.
    # index.html must NOT be cached (browser/CF), else a deploy's new hashed JS is
    # never picked up and users keep the stale SPA. Hashed /assets/ stay immutable.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Lightweight liveness probe.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # Security headers — matches the web app baseline.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
