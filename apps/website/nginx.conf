# CSP violation reports, one JSON line per report. The body is logged verbatim
# (document-uri, violated-directive, blocked-uri), which is the whole point of
# running the policy in Report-Only first.
log_format csp escape=json '{"t":"$time_iso8601","report":"$request_body"}';

server {
    # 8080: the image runs nginx as the unprivileged nginx user, which cannot
    # bind a privileged port. Caddy proxies here (infra/caddy-sonoqui.snippet).
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Don't leak the nginx version on error pages / response headers.
    server_tokens off;

    # Emit relative Location headers (e.g. "/it/") instead of absolute ones.
    # TLS is terminated at Caddy; the internal hop to this container is plain
    # http, so nginx would otherwise expand "return 301 /it/" using $scheme=http
    # and send "Location: http://sonoqui.pro/it/" — forcing Cloudflare to
    # 308-upgrade it to https (a redundant 2nd hop). A relative Location lets
    # the browser resolve against the current scheme+host (https, and the
    # correct vhost — this container also serves partners.sonoqui.pro).
    absolute_redirect off;

    # Branded static 404 (Astro emits /404.html on build).
    error_page 404 /404.html;

    # Instant server-side redirect for the bare root so visitors never see
    # Astro's "Redirecting from / to /it/" HTML flash.
    location = / {
        return 301 /it/;
    }
    location = /index.html {
        return 301 /it/;
    }

    # Long cache for hashed Astro assets.
    location /_astro/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Static multi-page site: serve file, then dir index, else 404.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Lightweight liveness probe used by docker HEALTHCHECK upstream.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # Where Content-Security-Policy-Report-Only sends violations. nginx only
    # fills $request_body in a location that proxies, so the report is handed
    # to this container's own /csp-sink (below, answers 204 immediately)
    # purely to get the body read before it is logged.
    location = /csp-report {
        access_log /var/log/nginx/access.log csp;
        client_max_body_size 32k;
        client_body_buffer_size 32k;
        proxy_pass http://127.0.0.1:8080/csp-sink;
    }

    # The /csp-report proxy's own upstream. 204, no body and no Content-Type,
    # so nginx does not warn about a duplicate header while reading it back.
    location = /csp-sink {
        access_log off;
        return 204;
    }

    # sha256 of every inline script Astro emitted, as $csp_script_hashes.
    # Written by scripts/csp-hashes.mjs at build time, copied in by the
    # Dockerfile. Defined before the include so a policy is still emitted (and
    # the inline scripts simply reported) if the snippet is ever empty.
    set $csp_script_hashes "";
    include /etc/nginx/csp-script-hashes.conf;

    # Security headers.
    # HSTS: the http→https hop is a Cloudflare redirect, which leaves a visitor's
    # very first plaintext request (typed URL, stale bookmark, captive portal)
    # unprotected until the redirect is honoured. One year, subdomains included
    # (app/api/partners/ota are all HTTPS-only already). No `preload` yet — that
    # is a one-way door; add it once this has run clean for a while.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Content Security Policy — REPORT-ONLY on purpose. Nothing is blocked yet;
    # violations are POSTed to /csp-report and land in this container's log.
    # Read them for a while, then flip the header name to enforce.
    # The source list is what the built site actually uses:
    #   script-src   /_astro bundles ('self'), the inlined Astro module scripts
    #                (hashes above) and Turnstile, which the contact/signup
    #                forms inject as challenges.cloudflare.com/turnstile/v0/api.js.
    #                JSON-LD is a data block, never executed, so it needs nothing.
    #   style-src    'unsafe-inline': Tailwind/Astro emit style attributes.
    #   connect-src  'self' covers the first-party PostHog relay (/relay/*);
    #                Turnstile talks to its own origin.
    #   media-src    the promo and cantieri mp4s on the R2 public bucket.
    add_header Reporting-Endpoints 'csp-endpoint="/csp-report"' always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' $csp_script_hashes https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self' https://pub-afe31975ed804122bb97af292e3a31cf.r2.dev; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:; manifest-src 'self'; report-uri /csp-report; report-to csp-endpoint" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;
}
