# gitleaks configuration.
#
# The scan runs over the FULL history (fetch-depth: 0 in
# .github/workflows/security-scan.yml), because a secret that was committed and
# later deleted is still readable in the reachable objects of what is a public
# repository. That reach is also why the default ruleset produces false
# positives here: it sees every example file, every machine-generated lockfile
# and every design document this repo has ever contained.
#
# Every waiver below is scoped to the SHAPE of the false positive, not to a
# rule and not to a whole tree, so a real credential landing in the same file
# still fails the build. Nothing here is a rotated or accepted secret: all 15
# findings this file suppresses were verified by hand to contain no credential.

[extend]
useDefault = true

# `.env.example` / `.env.production.example` ship the variable names with
# deliberate placeholder values (REPLACE_WITH_HEX_32,
# REPLACE_FROM_OPT_INFRA_DOT_ENV). Matched on the value, so a real key pasted
# over a placeholder in the same file is still a finding.
[[allowlists]]
description = "REPLACE_* placeholders in committed .env examples"
regexTarget = "secret"
regexes = ['''^REPLACE[A-Z0-9_]*$''']

# `const secret = env.E2E_PURGE_SECRET;` — the generic-api-key rule matches the
# identifier, not a value. An `env.FOO` reference is by construction a lookup of
# something held outside the repo.
[[allowlists]]
description = "env.<NAME> references read as secrets by generic-api-key"
regexTarget = "secret"
regexes = ['''^env\.[A-Z0-9_]+$''']

# apps/mobile/ios/Podfile.lock is generated by CocoaPods and is nothing but pod
# names and SPEC CHECKSUM SHA-1s, which are indistinguishable from a hex token.
# Nobody writes a credential into it by hand: `pod install` would drop it.
[[allowlists]]
description = "CocoaPods SPEC CHECKSUM hashes in the generated Podfile.lock"
paths = ['''apps/mobile/ios/Podfile\.lock$''']

# google-services.json (repo root copy + the android/app/ copy the Gradle plugin
# reads) holds the Firebase Android API key, `AIzaSy...`. Google publishes this
# value inside every shipped APK on purpose: it identifies the app, it is not a
# credential, and the file contains no private key (verified). What protects it
# is the API-key restriction in the Google Cloud console — package name
# app.sonoqui.mobile plus signing SHA-1 — not secrecy.
[[allowlists]]
description = "Firebase Android client config (public by design, no private key)"
paths = ['''(^|/)google-services\.json$''']

# Two hits in Specs/BOILERPLATE_ARCHITECTURE.md: a Centrifugo proxy URL path,
# and a bare `SCHEDULER_ENABLED=true` sitting under an empty
# `REVENUECAT_WEBHOOK_AUTH=`. Waived by content rather than by path — the Specs
# tree does paste real config shapes and must stay scanned.
[[allowlists]]
description = "Design-doc URL paths and boolean flags read as tokens"
stopwords = [
  "centrifugo/subscribe",
  "SCHEDULER_ENABLED",
]
