# gitleaks configuration.
#
# The scan runs over the FULL history (fetch-depth: 0 in
# .github/workflows/security-scan.yml), because a secret that was committed and
# later deleted is still readable in the reachable objects of what is a public
# repository. That reach is also why the default ruleset produces false
# positives here: it sees every example file, every machine-generated lockfile
# and every design document this repo has ever contained.
#
# Every waiver below is scoped to the SHAPE of the false positive, not to a rule
# and not to a whole tree, so a real credential landing in the same file still
# fails the build. Nothing here is a rotated or accepted secret: all 15 findings
# this file suppresses were verified by hand to contain no credential.
#
# ONE `[allowlist]` block, deliberately. The `[[allowlists]]` array form is
# nicer — a description per waiver — but it needs gitleaks >= 8.25, and
# gitleaks-action is pinned to a SHA that installs 8.24.3, which loads this file
# and then silently ignores the array. If the action pin moves to a release
# carrying a newer binary, this can be split up.

[extend]
useDefault = true

[allowlist]
description = "Verified false positives — see the per-entry notes below"

paths = [
  # apps/mobile/ios/Podfile.lock is generated by CocoaPods and is nothing but
  # pod names and SPEC CHECKSUM SHA-1s, indistinguishable from a hex token.
  # Nobody writes a credential into it by hand: `pod install` would drop it.
  '''apps/mobile/ios/Podfile\.lock$''',

  # google-services.json (repo root copy + the android/app/ copy the Gradle
  # plugin reads) holds the Firebase Android API key, `AIzaSy...`. Google
  # publishes this value inside every shipped APK on purpose: it identifies the
  # app, it is not a credential, and the file contains no private key
  # (verified). What protects it is the API-key restriction in the Google Cloud
  # console — package name app.sonoqui.mobile plus signing SHA-1 — not secrecy.
  '''(^|/)google-services\.json$''',
]

# Matched against the secret itself, so a real key pasted over a placeholder in
# one of these same files is still a finding.
regexTarget = "secret"
regexes = [
  # `.env.example` / `.env.production.example` ship the variable names with
  # deliberate placeholders: REPLACE_WITH_HEX_32,
  # REPLACE_FROM_OPT_INFRA_DOT_ENV.
  '''^REPLACE[A-Z0-9_]*$''',

  # `const secret = env.E2E_PURGE_SECRET;` — generic-api-key matches the
  # identifier, not a value. An `env.<NAME>` reference is by construction a
  # lookup of something held outside the repo.
  '''^env\.[A-Z0-9_]+$''',
]

# Two hits in Specs/BOILERPLATE_ARCHITECTURE.md: a Centrifugo proxy URL path,
# and a bare `SCHEDULER_ENABLED=true` sitting under an empty
# `REVENUECAT_WEBHOOK_AUTH=`. Waived by content rather than by path — the Specs
# tree does paste real config shapes and must stay scanned.
stopwords = [
  "centrifugo/subscribe",
  "SCHEDULER_ENABLED",
]
